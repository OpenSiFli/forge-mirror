name: Python Quality Checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'hub-mirror/**'
      - '.github/workflows/flake8.yaml'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --project hub-mirror --frozen

      - name: Lint with flake8
        run: |
          uv run --project hub-mirror --with flake8 \
            flake8 hub-mirror/*.py hub-mirror/tests

      - name: Run pytest
        run: |
          uv run --project hub-mirror --with pytest pytest hub-mirror/tests

      - name: Run mypy
        run: |
          uv run --project hub-mirror --with mypy bash -lc '
            cd hub-mirror &&
            mypy --ignore-missing-imports \
              --disable-error-code import-untyped \
              -m hub -m hubmirror -m mirror -m platforms -m config
          '
