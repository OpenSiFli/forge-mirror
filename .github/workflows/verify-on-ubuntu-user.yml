on:
  push:
  pull_request_target:
    branches: [master]
name: Tests / test-user-mirror
jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source codes
        uses: actions/checkout@v4
      - name: Mirror Github to Gitee with static repos
        uses: ./.
        with:
          src_platform: github
          src_account: Yikun
          dst_platform: gitee
          dst_account: yikunkero
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          repos: |
            static:
              - hub-mirror-action
              - hashes
              - simple-spring
            mappings:
              hashes: hashes_gitee
          push_strategy: force
          log_level: DEBUG
