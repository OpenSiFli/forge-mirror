[project]
name = "hub-mirror"
version = "2.0.0"
description = "Mirror repositories between Git hubs."
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "GitPython>=3.1.40",
  "requests>=2.31.0",
  "tenacity>=8.2.0",
  "click==8.1.7",
]

[project.scripts]
hubmirror = "hubmirror:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hubmirror", "hub", "mirror", "platforms", "utils", "config"]
