spec:
  inputs:
    job-name:
      description: "Job name to run the mirror"
      default: "hub-mirror"
    stage:
      description: "Pipeline stage for the job"
      default: "sync"
    image:
      description: "Docker image with hubmirror CLI (built from this repo)"
      type: string
    cache-key:
      description: "Cache key for mirror cache directories"
      default: "hub-mirror-$CI_RUNNER_EXECUTABLE_ARCH"
    cache-path:
      description: "Directory to cache repo clones (relative to CI project dir)"
      default: "hub-mirror-cache"

    src-platform:
      description: "Source platform (github/gitee/gitlab/gitcode/git)"
      default: "github"
    src-account:
      description: "Source account or organization name"
      type: string
    dst-platform:
      description: "Destination platform (github/gitee/gitlab/gitcode/git)"
      type: string
    dst-account:
      description: "Destination account or organization name"
      type: string

    src-key:
      description: "Source SSH private key (required when src-transport=ssh)"
      default: ""
    dst-key:
      description: "Destination SSH private key (required when dst-transport=ssh)"
      default: ""
    src-token:
      description: "Source API token"
      default: ""
    dst-token:
      description: "Destination API token"
      type: string

    src-account-type:
      description: "Source account type (user/org/group)"
      default: "user"
    dst-account-type:
      description: "Destination account type (user/org/group)"
      default: "user"

    src-endpoint:
      description: "Source self-hosted endpoint (e.g. gitlab.example.com)"
      default: ""
    src-api-endpoint:
      description: "Source API endpoint (optional, overrides API host used for source requests)"
      default: ""
    dst-endpoint:
      description: "Destination self-hosted endpoint"
      default: ""
    dst-api-endpoint:
      description: "Destination API endpoint (optional, overrides API host used for destination requests)"
      default: ""

    repos:
      description: "YAML repos configuration"
      default: ""

    src-transport:
      description: "Source transport (https/ssh)"
      default: "https"
    dst-transport:
      description: "Destination transport (https/ssh)"
      default: "ssh"
    ssh-user:
      description: "SSH username"
      default: "git"
    push-strategy:
      description: "Push strategy: safe/force/no"
      default: "safe"
    log-level:
      description: "Log level: DEBUG/INFO/WARNING/ERROR"
      default: "INFO"
    timeout:
      description: "Timeout per git command, e.g. 30m"
      default: "30m"
    api-timeout:
      description: "API timeout, e.g. 60, 2m"
      default: "60"
    lfs:
      description: "Enable Git LFS support"
      type: boolean
      default: false
    dst-visibility:
      description: "Destination visibility: auto/public/private"
      default: "auto"
---
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.image ]]
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  cache:
    key: $[[ inputs.cache-key ]]
    paths:
      - $[[ inputs.cache-path ]]
  script:
    - set -eu
    - SRC_TRANSPORT="$[[ inputs.src-transport ]]"
    - DST_TRANSPORT="$[[ inputs.dst-transport ]]"
    - LFS="$[[ inputs.lfs ]]"
    - mkdir -p ~/.ssh
    - |
      if [ "$SRC_TRANSPORT" = "ssh" ]; then
        if [ -z "$[[ inputs.src-key ]]" ]; then
          echo "src-key is required when src-transport=ssh" >&2
          exit 1
        fi
        printf "%s" "$[[ inputs.src-key ]]" > ~/.ssh/id_rsa_src
        chmod 600 ~/.ssh/id_rsa_src
      fi
    - |
      if [ "$DST_TRANSPORT" = "ssh" ]; then
        if [ -z "$[[ inputs.dst-key ]]" ]; then
          echo "dst-key is required when dst-transport=ssh" >&2
          exit 1
        fi
        printf "%s" "$[[ inputs.dst-key ]]" > ~/.ssh/id_rsa_dst
        chmod 600 ~/.ssh/id_rsa_dst
      fi
    - printf "StrictHostKeyChecking no\nUserKnownHostsFile /dev/null\n" >> ~/.ssh/config
    - |
      if [ "$LFS" = "true" ]; then
        git lfs install
      fi
    - |
      CACHE_PATH="$[[ inputs.cache-path ]]"
      if [ "${CACHE_PATH#/}" = "$CACHE_PATH" ]; then
        CACHE_PATH="$CI_PROJECT_DIR/$CACHE_PATH"
      fi
      mkdir -p "$CACHE_PATH"
    - |
      hubmirror \
        --src-platform "$[[ inputs.src-platform ]]" \
        --src-account "$[[ inputs.src-account ]]" \
        --dst-platform "$[[ inputs.dst-platform ]]" \
        --dst-account "$[[ inputs.dst-account ]]" \
        --dst-token "$[[ inputs.dst-token ]]" \
        --src-token "$[[ inputs.src-token ]]" \
        --src-account-type "$[[ inputs.src-account-type ]]" \
        --dst-account-type "$[[ inputs.dst-account-type ]]" \
        --src-endpoint "$[[ inputs.src-endpoint ]]" \
        --src-api-endpoint "$[[ inputs.src-api-endpoint ]]" \
        --dst-endpoint "$[[ inputs.dst-endpoint ]]" \
        --dst-api-endpoint "$[[ inputs.dst-api-endpoint ]]" \
        --src-transport "$[[ inputs.src-transport ]]" \
        --dst-transport "$[[ inputs.dst-transport ]]" \
        --ssh-user "$[[ inputs.ssh-user ]]" \
        --cache-path "$CACHE_PATH" \
        --repos "$[[ inputs.repos ]]" \
        --push-strategy "$[[ inputs.push-strategy ]]" \
        --log-level "$[[ inputs.log-level ]]" \
        --timeout "$[[ inputs.timeout ]]" \
        --api-timeout "$[[ inputs.api-timeout ]]" \
        --lfs "$[[ inputs.lfs ]]" \
        --dst-visibility "$[[ inputs.dst-visibility ]]"
