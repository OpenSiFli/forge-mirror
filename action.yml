name: "Forge Mirror"
description: "Mirror repos between Git hosting platforms."
author: "yikun"
branding:
  icon: "upload-cloud"
  color: "gray-dark"
inputs:
  src_platform:
    description: "Source platform (github/gitee/gitlab/gitcode/git)."
    default: 'github'
  src_account:
    description: "Source account or organization name (optional for git platform)."
    required: true
  dst_platform:
    description: "Destination platform (github/gitee/gitlab/gitcode/git)."
    required: true
  dst_account:
    description: "Destination account or organization name (optional for git platform)."
    required: true

  src_key:
    description: "Source SSH private key (required when src_transport=ssh)."
    required: false
  dst_key:
    description: "Destination SSH private key (required when dst_transport=ssh)."
    required: false
  src_token:
    description: "Source API token."
    required: false
  dst_token:
    description: "Destination API token used to create/update repositories."
    required: true

  src_account_type:
    description: "Source account type (user/org/group)."
    default: 'user'
  dst_account_type:
    description: "Destination account type (user/org/group)."
    default: 'user'

  src_endpoint:
    description: "Source self-hosted endpoint, e.g. gitlab.example.com (no https://)."
    default: ''
  dst_endpoint:
    description: "Destination self-hosted endpoint, e.g. gitlab.example.com (no https://)."
    default: ''

  repos:
    description: "YAML repos config (static/include/exclude/mappings/refs)."
    default: ''

  src_transport:
    description: "Source transport (https/ssh)."
    default: 'https'
  dst_transport:
    description: "Destination transport (https/ssh)."
    default: 'ssh'
  ssh_user:
    description: "SSH username."
    default: 'git'
  push_strategy:
    description: "Push strategy: safe(--force-with-lease)/force(-f)/no(normal)."
    default: 'safe'
  log_level:
    description: "Log level (DEBUG/INFO/WARNING/ERROR)."
    default: 'INFO'
  timeout:
    description: "Git command timeout, e.g. 30m, 1h, 600."
    default: '30m'
  api_timeout:
    description: "API timeout, e.g. 60, 2m."
    default: '60'
  cache_path:
    description: "Local cache path for repositories. Relative paths are prefixed with github.workspace."
    default: 'hub-mirror-cache'
  lfs:
    description: "Enable Git LFS."
    default: false
  dst_visibility:
    description: "Destination visibility (auto/public/private)."
    default: 'auto'
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Compute uv cache key
      id: uv-cache
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const actionPath = process.env.GITHUB_ACTION_PATH;
          const files = [
            path.join(actionPath, 'hub-mirror', 'uv.lock'),
            path.join(actionPath, 'hub-mirror', 'pyproject.toml'),
          ];
          const hash = crypto.createHash('sha256');
          for (const file of files) {
            hash.update(fs.readFileSync(file));
          }
          core.setOutput('uv_cache_key', hash.digest('hex'));

    - uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ steps.uv-cache.outputs.uv_cache_key }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --project ${{ github.action_path }}/hub-mirror --frozen
      shell: bash

    - name: Configure SSH
      if: ${{ inputs.src_transport == 'ssh' || inputs.dst_transport == 'ssh' }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh

        SRC_TRANSPORT="${{ inputs.src_transport }}"
        DST_TRANSPORT="${{ inputs.dst_transport }}"
        SRC_KEY="${{ inputs.src_key }}"
        DST_KEY="${{ inputs.dst_key }}"

        if [[ "$SRC_TRANSPORT" == "ssh" ]]; then
          if [[ -z "$SRC_KEY" ]]; then
            echo "Error: src_key is required when src_transport=ssh." >&2
            exit 1
          fi
          printf "%s" "$SRC_KEY" > ~/.ssh/id_rsa_src
          chmod 600 ~/.ssh/id_rsa_src
        fi

        if [[ "$DST_TRANSPORT" == "ssh" ]]; then
          if [[ -z "$DST_KEY" ]]; then
            echo "Error: dst_key is required when dst_transport=ssh." >&2
            exit 1
          fi
          printf "%s" "$DST_KEY" > ~/.ssh/id_rsa_dst
          chmod 600 ~/.ssh/id_rsa_dst
        fi

        printf "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile=/dev/null\n" > ~/.ssh/config
        chmod 600 ~/.ssh/config
      shell: bash

    - name: Run Hub Mirror
      run: |
        if [[ "${{ inputs.log_level }}" == "DEBUG" ]]; then
          set -x
        fi

        if [[ "${{ inputs.lfs }}" == "true" ]]; then
          if ! command -v git-lfs &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y git-lfs
          fi
          git lfs install
        fi

        CACHE_PATH="${{ inputs.cache_path }}"
        if [[ "$CACHE_PATH" == /github/workspace* ]]; then
          CACHE_PATH="${{ github.workspace }}${CACHE_PATH#/github/workspace}"
        fi
        if [[ "$CACHE_PATH" != /* ]]; then
          CACHE_PATH="${{ github.workspace }}/$CACHE_PATH"
        fi
        mkdir -p "$CACHE_PATH"
        echo "Using CACHE_PATH: $CACHE_PATH"

        uv run --project ${{ github.action_path }}/hub-mirror hubmirror \
          --src-platform "${{ inputs.src_platform }}" \
          --src-account "${{ inputs.src_account }}" \
          --dst-platform "${{ inputs.dst_platform }}" \
          --dst-account "${{ inputs.dst_account }}" \
          --dst-token "${{ inputs.dst_token }}" \
          --src-token "${{ inputs.src_token }}" \
          --src-account-type "${{ inputs.src_account_type }}" \
          --dst-account-type "${{ inputs.dst_account_type }}" \
          --src-endpoint "${{ inputs.src_endpoint }}" \
          --dst-endpoint "${{ inputs.dst_endpoint }}" \
          --src-transport "${{ inputs.src_transport }}" \
          --dst-transport "${{ inputs.dst_transport }}" \
          --ssh-user "${{ inputs.ssh_user }}" \
          --cache-path "$CACHE_PATH" \
          --repos "${{ inputs.repos }}" \
          --push-strategy "${{ inputs.push_strategy }}" \
          --log-level "${{ inputs.log_level }}" \
          --timeout "${{ inputs.timeout }}" \
          --api-timeout "${{ inputs.api_timeout }}" \
          --lfs "${{ inputs.lfs }}" \
          --dst-visibility "${{ inputs.dst_visibility }}"
      shell: bash
